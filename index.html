<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Comment Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    
    <div class="container">
        <header class="main-header">
            <h1>Feedback & Comments Portal</h1>
            <p>Manage, view, and update user discussions in real-time.</p>
        </header>

        <div class="form-card">
            <form id="commentForm">
                <div class="form-group">
                    <label for="name">Name*</label>
                    <input type="text" id="name" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email*</label>
                    <input type="email" id="email" required placeholder="Enter your email address">
                </div>

                <div class="form-group">
                    <label for="body">Comment*</label>
                    <textarea id="body" rows="4" required placeholder="Write your comment here..."></textarea>
                </div>

                <div class="form-group">
                    <label for="userId">UserId*</label>
                    <select id="userId" required>
						<option value="disabled selected">Select User ID</option>
						<option value="1">1</option>
						<option value="2">2</option>
						<option value="3">3</option>
						<option value="4">4</option>
						<option value="5">5</option>
						<option value="6">6</option>
						<option value="7">7</option>
						<option value="8">8</option>
						<option value="9">9</option>
						<option value="10">10</option>
					</select>
                </div>

                <button type="submit" id="addCommentBtn" class="btn btn-primary">Add Comment</button>
                <button type="button" id="updateCommentBtn" class="btn btn-success d-none">Update Comment</button>
            </form>
        </div>

        <div class="table-card">
            <h2>All Live Comments</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th width="8%">ID</th>
                            <th width="12%">User ID</th>
                            <th width="20%">Name</th>
                            <th width="20%">Email</th>
                            <th width="30%">Comment</th>
                            <th width="5%" class="text-center">Edit</th>
                            <th width="5%" class="text-center">Delete</th>
                        </tr>
                    </thead>
                    <tbody id="commentContainer">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

	<div id="spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
